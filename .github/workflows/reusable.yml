name: reusable by calling
on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        default: dest
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
      - name: list files
        run: ls
      - name: output information
        run: echo "Deploying the app ..."